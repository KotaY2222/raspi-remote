<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="theme-color" content="#f4f5f8">
<script>
// 画面が一瞬ちらつかないよう、描画の前に配色を決める。保存した選択があればそれを、なければ端末の設定を使う
(function () {
  var t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="リモコン">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>おうちリモコン</title>
</head>
<body>
<main id="app" class="loading">
  <header class="top">
    <div>
      <p class="eyebrow" id="today"></p>
      <h1>おうちリモコン</h1>
      <span class="demo-pill" id="demo" hidden>デモ: 赤外線はダミー送信</span>
    </div>
    <div class="top-r">
      <span class="conn" id="conn" role="status"><i></i><b>接続中</b></span>
      <button class="theme-btn" id="theme" type="button" aria-label="表示の明るさを切り替える" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="wx" id="wx" aria-label="外の気温と湿度"></section>

  <section class="scenes" id="scenes" aria-label="シーン"></section>

  <section class="card ai" id="card-ai" aria-label="話しかけて操作">
    <div class="card-head">
      <div class="card-title">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg></span>
        <div><h2>話しかけて操作</h2><p id="ai-engine">読み込み中</p></div>
      </div>
    </div>
    <form class="ai-form" id="ai-form" autocomplete="off">
      <input id="ai-input" type="text" maxlength="200" placeholder="例: 暑いから冷房つけて" enterkeyhint="send" aria-label="話しかける内容">
      <button type="submit" id="ai-send">送る</button>
    </form>
    <div class="ai-chips" id="ai-chips"></div>
    <p class="ai-result" id="ai-result" role="status"></p>
  </section>

  <section class="card ac" id="card-aircon" aria-label="エアコン"></section>
  <section class="card light" id="card-light" aria-label="照明"></section>
  <section class="card tv" id="card-tv" aria-label="テレビ"></section>

  <section class="card log" id="card-log" aria-label="送信ログ" hidden></section>

  <p class="foot">エアコンの表示は、このアプリが最後に送った設定です。付属リモコンで操作した場合は「再送」で合わせ直せます。</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
